name: Build & Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  verify-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build production Docker image (local verify)
        run: docker build -t upsphere-platform:ci .

  build-and-push:
    needs: verify-docker-image
    if: ${{ vars.ECR_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      REGION: ${{ secrets.AWS_REGION }}
      REPOSITORY: upsphere-platform

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitActionsOIDCRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    needs: [verify-docker-image, build-and-push]
    if: >-
      always() &&
      needs.verify-docker-image.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Integration Tests
        run: npm run test:integration

  require-aws-for-publish:
    needs: [verify-docker-image, build-and-push, integration-tests]
    if: >-
      always() &&
      vars.ECR_PUBLISH_ENABLED != 'true' &&
      needs.verify-docker-image.result == 'success' &&
      needs.integration-tests.result == 'success' &&
      needs.build-and-push.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Block publish until AWS is configured
        run: |
          echo "::error::Set repository variable ECR_PUBLISH_ENABLED=true and configure secrets AWS_ACCOUNT_ID and AWS_REGION to push images to ECR and deploy to production."
          exit 1
