name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Publish"]
    types: [completed]

jobs:
  deploy-production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      actions: read

    environment: production

    env:
      REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      REPOSITORY: upsphere-platform

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitActionsOIDCRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name eks-cluster-production --region ${{ secrets.AWS_REGION }} --alias eks-production

      - name: Deploy to EKS
        run: |
          helm upgrade --install upsphere ./infra/helm/upsphere-platform \
            --namespace production \
            --create-namespace \
            --values ./infra/helm/upsphere-platform/values-production.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.REPOSITORY }} \
            --set image.tag=${{ github.event.workflow_run.head_sha }} \
            --wait

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: npm

      - name: Run Smoke Tests
        continue-on-error: true
        run: npm run test:smoke -- --base-url=https://api.upchar.com

      - name: Notify Deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: "Production deployment ${{ job.status }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
